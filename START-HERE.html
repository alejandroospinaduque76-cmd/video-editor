<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Video Editor · Tu primer video</title><style>:root{--ink:#222322;--muted:#666760;--paper:#f6f5f0;--line:#ddded6;--purple:#6750bd;--light:#efebfb;--green:#305c45;--radius:18px;--shadow:0 12px 42px #22222206}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,summary{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #816bd4;outline-offset:4px}a{color:var(--purple);text-underline-offset:4px}button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:10px;padding:10px 16px}button:hover{border-color:var(--purple)}button:disabled{opacity:.45;cursor:default}.primary{background:var(--ink);border-color:var(--ink);color:white}.primary:hover{background:#41413d}.quiet{background:transparent}.skip{position:fixed;top:-70px;left:20px;z-index:100;background:white;padding:12px}.skip:focus{top:10px}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 38px;border-bottom:1px solid var(--line);background:var(--paper);gap:16px}.brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:750;letter-spacing:-.3px}.mark{width:34px;height:34px;background:var(--ink);border-radius:10px;display:grid;place-content:center;color:#d9f27f;font-size:20px}.topright{display:flex;gap:10px;align-items:center}.edition{font:11px/1.3 ui-monospace,monospace;color:var(--muted);letter-spacing:.1em;margin-left:10px}.topbar select{border:1px solid var(--line);border-radius:8px;padding:8px;background:transparent}.shell{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1580px;margi </style></head><body><div id="app"></div><noscript><h1>Video Editor Guide</h1><p>Enable JavaScript for the interactive guide, or open <a href="help/QUICK-START.md">the English text guide</a> / <a href="help/GUIA-PASO-A-PASO.md">la guía en español</a> / <a href="help/SOLUCION-DE-PROBLEMAS.md">solución de problemas</a>.</p></noscript><div id="toast" class="toast" role="status" aria-live="polite"></div><dialog id="copy-dialog"><h2 id="copy-title">Copy instruction</h2><p id="copy-hint"></p><textarea id="copy-text" aria-label="Instruction to copy" readonly></textarea><button id="close-copy">Close</button></dialog><script>const DATA={"es": {"steps": [["Conoce tu kit", "Entiende qué hace cada pieza antes de instalar.", ["El editor reúne instrucciones y herramientas que ejecutas en tu computador con Claude Code o Codex. Tú aportas el material, das dirección y revisas las decisiones de edición.", "Esta guía te acompaña paso a paso. El agente de ayuda consulta la documentación del kit para explicar dudas y diagnosticar errores.", "Necesitas acceso propio a Claude Code o Codex, internet para la instalación y espacio para material y descargas. El uso de IA, las aplicaciones de pago y los servicios opcionales se pagan por separado."], "Puedes distinguir el editor, la guía y el agente de ayuda. Tienes un clip propio de 20–60 segundos para practicar.", "Este kit se abre como proyecto local en Claude Code o Codex. El chat web básico de Claude o ChatGPT no ejecuta estas herramientas por sí solo.", null], ["Abre la carpeta correcta", "Abre el kit en el asistente que elegiste.", ["Extrae todo el ZIP. Abre la carpeta video-editor que contiene SETUP.md, CLAUDE.md y AGENTS.md. Conserva también la carpeta oculta .claude.", "Elige Claude Code o Codex e inicia sesión con tu propia cuenta. Si eliges Codex, sigue help/USAR-CON-CODEX.md. En Windows, los scripts del kit requieren Git Bash.", "Abre la carpeta completa como proyecto local en el entorno que elegiste y escribe empezar. El asistente confirma la carpeta, revisa tu equipo y las herramientas y después aprende tu estilo de edición."], "Tu asistente puede leer SETUP.md y reconoce la carpeta completa. En Codex también ha leído AGENTS.md.", "Si no encuentra SETUP.md, probablemente abriste la carpeta superior o una copia incompleta. Comprueba la ubicación antes de instalar nada.", "empezar"], ["Prepara las herramientas", "Instala una vez y comprueba lo que quedó listo.", ["Primero pide el diagnóstico con bash setup.sh --check. No instala herramientas ni cambia conexiones.", "Selecciona arriba Claude Code o Codex. Para Codex sin app de edición, la instalación es bash setup.sh --host codex --lane chat-only. Los puentes de otras apps requieren una configuración específica.", "Revisa los requisitos y las descargas antes de instalar. Reinicia el entorno elegido solo si se necesita. Comprueba un clip corto después; los requisitos correctos no prueban una edición completa."], "El informe no muestra requisitos obligatorios pendientes. Conoces la ruta de edición elegida; la confirmarás en el paso 4.", "Una descarga puede tardar. Pide que compruebe si hay progreso o un error; no borres cachés ni repitas instalaciones a ciegas.", "Lee las instrucciones de mi entorno y ejecuta bash setup.sh --check. Explica qué falta, qué se descargará y qué ruta está disponible. En Codex usa únicamente la instalación local documentada con --host codex --lane chat-only; comprueba por separado los puentes de aplicaciones. No configures servidores de Claude para Codex."], ["Elige dónde editar", "Selecciona la ruta que corresponde a tu aplicación.", ["Una “ruta de edición” indica dónde se arma y exporta el video. Puedes usar una aplicación compatible o el procesamiento local llamado chat-only.", "Selecciona abajo la ruta que realmente usarás. Las funciones automatizadas varían entre aplicaciones; revisa la limitación indicada antes de empezar.", "Pide al editor que confirme la conexión y las funciones disponibles. Tener la aplicación instalada no demuestra que esté conectada."], "El editor identifica tu ruta y confirma su conexión, o explica qué falta para activarla.", "Si falla la conexión, ve a Ayuda. No cambies de aplicación a mitad de un trabajo sin que el editor revise el proyecto existente.", null], ["Haz tu primer video", "Empieza pequeño: un clip, un objetivo, una prueba.", ["Elige un clip propio de 20–60 segundos, con una persona hablando claramente. Ábrelo primero para comprobar que se ve y se oye. Los videos de celular en vertical se detectan como vertical aunque el archivo diga 3840×2160; el idioma se detecta solo.", "Completa el formulario de abajo. La ruta es la dirección del archivo en tu computador. El formulario prepara una instrucción; no sube ni procesa el video.", "Pega la instrucción en Claude Code o Codex. Revisa el texto transcrito y los cortes propuestos. Pide una vista previa antes de aprobar la exportación final."], "Hay un borrador reproducible, entiendes los cortes y el mensaje mantiene su sentido. Si el flujo se detiene, sabes en qué etapa está.", "Si dice que el archivo no existe, verifica su nombre, extensión y ruta. En Windows puedes usar “Copiar como ruta”; en Mac, Option + clic derecho permite copiar la ruta del archivo.", null], ["Revisa con criterio", "Da indicaciones que el editor pueda ejecutar.", ["Mira el borrador completo con sonido. Revisa que los cortes no cambien el significado y que nombres y cifras sean correctos.", "Comprueba que el rostro siga visible, que los subtítulos se lean y que la voz no quede tapada. Usa la comparación visual de abajo para practicar.", "Pide cambios concretos: momento, problema y resultado esperado. Conserva lo que ya aprobaste y revisa de nuevo el fragmento modificado."], "Aprobaste el mensaje, la ortografía, el encuadre y el audio. Ya puedes pedir el archivo final.", "“Hazlo mejor” no indica qué cambiar. Sustitúyelo por una petición como “en 00:12, baja el subtítulo para que no cubra mi cara”.", "En 00:12, conserva completa la frase sobre [tema]. Cambia el subtítulo [texto incorrecto] por [texto correcto]. Mantén el resto aprobado y muéstrame ese fragmento revisado antes de exportar."], ["Exporta y comprueba", "Encuentra el archivo que vas a compartir.", ["Cuando apruebes el borrador, pide la exportación. El lugar documentado es projects/<trabajo>/outputs/<trabajo>.final.mp4; el nombre real depende de tu proyecto.", "Pide comprobar el archivo completo con workflows/verify-export.py: duración, dimensiones y decodificación. Confirma también que tiene audio si el video lo requiere.", "Abre el MP4 final: revisa principio, mitad y final, sincronía de voz e imagen y dimensiones. Exportar no publica automáticamente en redes."], "Puedes localizar y reproducir el MP4 final fuera del editor. Guarda también el material original y el proyecto.", "Si no aparece, pide comprobar el archivo en outputs y el estado de exportación. No des por terminado el trabajo solo porque se cerró una ventana.", "Exporta el borrador exacto que aprobé. Verifica duración, dimensiones, audio y decodificación completa con workflows/verify-export.py. Usa finalize.sh con --source, --approved y --apply. Conserva originales y borradores; no sobrescribas un final existente ni ejecutes limpieza. Dame la ruta exacta y no publiques en redes."], ["Hazlo tuyo", "Personaliza la marca después de la primera prueba.", ["Abre brand-kit.md. Rellena tu nombre o marca, público, tono, colores y palabras que se suelen transcribir mal.", "Usa fuentes, imágenes, música y logos que tengas derecho a utilizar. Si una función requiere un servicio externo de pago, decide si quieres activarlo.", "Pide que aplique la marca según el mapa del archivo y haga una muestra corta. Aprueba esa muestra antes de usar el estilo en un proyecto largo."], "La muestra usa tus colores y tu vocabulario. Confirmaste que el texto sigue siendo legible.", "Si un cambio no aparece, pide comparar el valor de brand-kit.md con el preset usado. Un preset es una receta de estilo.", "Lee brand-kit.md y ayúdame a completar los campos que faltan, sin inventar datos de mi marca. Después aplica el mapa documentado y crea una muestra corta para revisar colores, fuentes y nombres. No actives servicios de pago sin mi autorización."], ["Pide ayuda útil", "Lleva el problema al agente incluido, con contexto.", ["Antes de preguntar, busca tu caso en help/SOLUCION-DE-PROBLEMAS.md. En Claude Code, usa el agente video-editor-help. En Codex, pide el modo de ayuda descrito en AGENTS.md y help/USAR-CON-CODEX.md.", "Incluye sistema, ruta, etapa y el mensaje exacto del error, sin claves ni información privada. El asistente consulta la documentación antes de responder.", "Pide primero un diagnóstico sin modificar archivos. En Codex es una instrucción de trabajo; no es un subagente con herramientas de lectura restringidas. Para aplicar una solución, indícalo expresamente al editor."], "Recibes una explicación vinculada a la documentación y un siguiente paso concreto; si falta evidencia, el agente la pide.", "En Claude Code, comprueba .claude/agents/video-editor-help.md. En Codex, comprueba AGENTS.md y pide modo de ayuda. Ambos requieren la carpeta completa.", "Actúa en modo de ayuda del kit. En Claude Code utiliza video-editor-help; en Codex sigue AGENTS.md. Lee la documentación antes de responder. Estoy en [sistema], usando [ruta], en [etapa]. Esperaba [resultado] y ocurrió [problema]. Error sin datos privados: [mensaje]. Dime qué está confirmado, qué falta y hasta tres pasos. No modifiques archivos todavía."], ["Retoma sin empezar de cero", "Continúa desde lo que realmente quedó hecho.", ["Vuelve a abrir la misma carpeta y localiza el proyecto. Su archivo RUN.md registra el avance del trabajo.", "Pide al editor revisar el registro y los archivos que existen. Que determine el último paso completado antes de continuar.", "Guarda una copia de tus originales y del resultado aprobado. Para problemas con la compra o descarga, usa el contacto del vendedor que aparece en tu recibo."], "El editor retoma el proyecto correcto y respeta las decisiones ya aprobadas.", "Si hay varios proyectos, identifica el correcto por su nombre y material. No dejes que seleccione uno al azar.", "Lee el RUN.md de mi proyecto [nombre] y comprueba sus archivos. Dime cuál fue la última etapa completada y qué queda pendiente. Continúa desde ahí sin sobrescribir el trabajo aprobado ni modificar mis originales."]], "faq": [["No encuentra el archivo · ruta · file not found", "Comprueba que extraíste el kit y que la ruta del clip apunta a un archivo existente. Si la ruta tiene espacios, consérvala completa entre comillas al escribir comandos. Pide al editor verificar la existencia antes de editar. Comprueba que el archivo esté descargado en el equipo, no solo disponible en la nube.", "Paso 2 y paso 5 · SETUP.md"], ["Windows: no reconoce un comando · Bash · FFmpeg", "Comprueba Git Bash y pide ejecutar check-setup.sh. Si instalaste herramientas, abre de nuevo el entorno que elegiste para que detecte sus ubicaciones. Resuelve el requisito que el informe identifica.", "SETUP.md · Core / Windows"], ["Windows: no puede escribir · OneDrive · permisos", "Usa una copia completa en una carpeta local que controles, fuera de OneDrive y de carpetas protegidas. No desactives la protección del sistema para completar el tutorial.", "SETUP.md · Windows"], ["La transcripción salió en otro idioma · inglés · traducción", "El kit detecta el idioma de cada clip automáticamente. Si el texto aparece en un idioma que no hablaste o con muchas palabras dudosas, pide repetir la transcripción forzando el idioma: transcribe.sh projects/<proyecto> --force --lang es. No apruebes cortes sobre una transcripción equivocada.", "Paso 5 · SETUP.md · Language"], ["La primera transcripción tarda mucho · WhisperX", "El modelo inicial ocupa unos 3–5 GB; el entorno y componentes GPU pueden añadir más. Pide comprobar descargas, espacio disponible y el último mensaje. El tiempo depende del equipo y la conexión.", "SETUP.md · First edit"], ["Premiere no se conecta · MCP", "Comprueba que el instalador de Premiere terminó. Reinicia Premiere y Claude Code según SETUP.md y revisa la conexión del proyecto. Pide el diagnóstico del puente antes de reinstalar.", "SETUP.md · Premiere lane"], ["Resolve · BRIDGE_UNAVAILABLE", "Indica si usas Free o Studio. La ruta documentada para Free requiere abrir un proyecto y ejecutar Workspace → Scripts → resolve_bridge cada vez que inicias Resolve. Sigue las instrucciones de tu edición.", "SETUP.md · DaVinci Resolve lane"], ["El subtítulo tapa la cara o tiene errores", "Da el segundo exacto y la palabra correcta. Pide corregir la transcripción de origen cuando corresponda y verificar el encuadre con una vista previa.", "Paso 6 · CLAUDE.md / graphics"], ["No aparece el agente de ayuda", "En Claude Code comprueba .claude/agents/video-editor-help.md. En Codex pide el modo de ayuda de AGENTS.md. Los agentes de .claude no se registran automáticamente en Codex.", "help/USAR-CON-CODEX.md"], ["No aparece el agente de ayuda", "Comprueba que existe .claude/agents/video-editor-help.md dentro de la carpeta abierta. Reinicia Claude Code e intenta de nuevo. El agente de ayuda lee y explica; las reparaciones las aplica el editor principal.", "Paso 9 · help/QUICK-START.md"], ["¿Puedo usar ChatGPT o Claude desde el navegador?", "La guía se puede leer en el navegador, pero el editor necesita Claude Code o Codex con acceso a la carpeta local y sus herramientas. El uso de IA y las aplicaciones opcionales no están incluidos.", "help/USAR-CON-CODEX.md"], ["¿Qué cambia al usar Codex?", "Codex lee AGENTS.md. Las etapas del editor siguen en .claude/skills como documentación. Los hooks, agentes y conexiones de Claude Code no se importan automáticamente. Revisa la guía de Codex antes de elegir una integración.", "help/USAR-CON-CODEX.md"], ["La exportación se detuvo · ya existe un final", "El kit conserva el final anterior. Elige un nuevo proyecto o versiona la entrega; no borres el archivo aprobado para forzar el proceso. Indica el nombre exacto del borrador que revisaste.", "finalize.sh · workflows/verify-export.py"]]}, "en": {"steps": [["Meet your kit", "Know what each part does before you install.", ["The editor is a collection of instructions and tools that Claude Code or Codex runs on your computer. You supply footage and review its editing decisions.", "This guide walks you through the workflow. The help agent reads the kit documentation to explain questions and investigate errors.", "You need your own Claude Code or Codex access, internet for setup and room for footage and downloads. AI usage, paid editing apps and optional services are separate."], "You can identify the editor, guide and help agent. You have a 20–60 second clip of your own to practice with.", "Expected a standalone app? This kit runs inside Claude Code. Step 2 prepares that environment.", null], ["Open the right folder", "Get the kit ready for your first conversation.", ["Extract the entire ZIP, including .claude, into a local folder. Check SETUP.md, CLAUDE.md and AGENTS.md.", "Open the folder in your chosen local environment: Claude Code or Codex. Windows scripts require Git Bash.", "Type empezar (Spanish for \"start\"). The editor confirms the folder, checks your computer and tools, then learns your editing style. In Codex it follows AGENTS.md and help/USAR-CON-CODEX.md; Claude hooks and MCP connections are not imported."], "Claude Code is open in video-editor and can read SETUP.md. The hidden .claude folder is still included.", "If SETUP.md is missing, you may have opened the parent folder or an incomplete copy. Check the location before installing tools.", "empezar"], ["Set up the tools", "Install once, then check what is ready.", ["Run bash setup.sh --check first. It diagnoses prerequisites without installing or wiring services.", "For Codex local processing use bash setup.sh --host codex --lane chat-only after reviewing downloads. Other app bridges need host-specific verification.", "Restart the selected environment only when needed. Complete a short test clip; a prerequisite check is not proof of a complete edit."], "The report has no outstanding required prerequisites. You know which editing route was selected; confirm it in step 4.", "A download can take time. Ask whether it is progressing or has reported an error before deleting caches or repeating installations.", "Read my host instructions and run bash setup.sh --check. Explain missing prerequisites and downloads. For Codex use the documented local setup with --host codex --lane chat-only; verify app bridges separately. Do not configure Claude servers for Codex."], ["Choose your editing route", "Match the workflow to your application.", ["An editing route means where your video is assembled and exported. Use a supported editing app or the local rendering route called chat-only.", "Select the route you will actually use below. Automated features vary between applications; read the limitation shown before starting.", "Ask the editor to confirm its connection and available features. Having the app installed does not prove it is connected."], "The editor identifies your route and confirms its connection, or explains what is still needed.", "If the connection fails, open Help. Do not switch apps midway through a job without reviewing the existing project first.", null], ["Make your first video", "Start small: one clip, one goal, one test.", ["Choose a 20–60 second clip you own, with one person speaking clearly. Play it first to check its picture and sound. Vertical phone clips are detected as vertical even when the file reports 3840×2160; the spoken language is detected automatically.", "Fill in the form below. A file path is the address of the clip on your computer. This form creates an instruction; it does not upload or process footage.", "Paste the instruction into Claude Code or Codex. Review the transcript and proposed cuts. Ask for a preview before approving the final export."], "You have a playable draft, understand the cuts and the message still makes sense. If work pauses, you know its current stage.", "If the file cannot be found, check its name, extension and location. Windows offers “Copy as path”; on Mac, Option + right-click offers a pathname copy action.", null], ["Review with a clear brief", "Give feedback the editor can act on.", ["Watch the entire draft with sound. Check that cuts preserve meaning and that names and numbers are correct.", "Check the face remains visible, captions are readable and the voice is clear. Use the visual comparison below to practice.", "Ask for specific changes: timestamp, problem and desired result. Keep approved sections and review the changed portion again."], "You have approved meaning, spelling, framing and audio. You can request the final file.", "“Make it better” gives no clear target. Try “at 00:12, move the caption lower so it does not cover my face”.", "At 00:12, keep the entire sentence about [topic]. Correct the caption [wrong text] to [correct text]. Preserve the rest of the approved edit and show me the revised section before exporting."], ["Export and verify", "Find the file you are going to share.", ["After approving the draft, request an export. The documented location is projects/<job>/outputs/<job>.final.mp4; the actual name depends on your project.", "Check the full file with workflows/verify-export.py: duration, dimensions, full decoding and audio where required.", "Open the final MP4: check its start, middle and end, audio sync and dimensions. Exporting does not automatically post it to social media."], "You can find and play the final MP4 outside the editor. Keep the original footage and project too.", "If it is missing, ask the editor to check the outputs folder and export status. A closed window alone does not prove completion.", "Export the exact draft I approved. Verify duration, dimensions, audio and full decoding with workflows/verify-export.py. Use finalize.sh with --source, --approved and --apply. Preserve originals and drafts; never overwrite an existing final or run cleanup. Give me the exact path without publishing."], ["Make it yours", "Add your brand after the first successful test.", ["Open brand-kit.md. Fill in your name or brand, audience, tone, colors and words that are often transcribed incorrectly.", "Use fonts, images, music and logos you have permission to use. If a feature requires an external paid service, decide whether to enable it.", "Ask the editor to apply the documented brand map and make a short sample. Approve the sample before applying the style to a long project."], "The sample uses your colors and vocabulary. You have checked that text is still readable.", "If a change is missing, ask the editor to compare brand-kit.md with the active preset. A preset is a style recipe.", "Read brand-kit.md and help me fill in missing fields without inventing brand information. Apply its documented map and create a short sample to review colors, fonts and names. Do not enable paid services without my approval."], ["Get useful help", "Give the included agent enough context.", ["In Claude Code use video-editor-help. In Codex request help mode according to AGENTS.md.", "Include OS, host, route, stage and redacted error. The assistant consults local documentation.", "Request diagnosis first, without changes. Codex help mode is an instruction, not an isolated read-only subagent. Ask the main assistant to apply a repair when ready."], "You receive a documented explanation and a concrete next step. If evidence is missing, the agent asks for it.", "If the agent is absent, restart Claude Code in the correct folder and check .claude/agents/video-editor-help.md. You can also ask the main editor to read this guide directly.", "Use documented help mode: video-editor-help in Claude Code, AGENTS.md in Codex. Read the docs. My OS is [OS], route [route], stage [stage]. Expected [result], got [problem]. Redacted error: [message]. State what is confirmed and at most three next steps. Do not modify files."], ["Pick up where you left off", "Continue from work that actually completed.", ["Reopen the same folder and identify your project. Its RUN.md file records the job’s progress.", "Ask the editor to check both the record and existing files. It should identify the last completed stage before continuing.", "Keep backups of the source footage and approved output. For purchase or download issues, use the seller contact on your receipt."], "The editor resumes the right project and preserves approved decisions.", "If several projects exist, identify yours by its name and footage. Do not let the editor choose one at random.", "Read RUN.md for my project [name] and inspect its files. Tell me the last completed stage and what remains. Continue from there without overwriting approved work or changing my original footage."]], "faq": [["File not found · path", "Confirm the kit is extracted and the clip path points to an existing file. Keep paths with spaces fully quoted when entering commands. Ask the editor to check the file before editing.", "Steps 2 and 5 · SETUP.md"], ["Windows: command not recognized · Bash · FFmpeg", "Check Git Bash and request check-setup.sh. Reopen Claude Code after installing tools so it can find them. Resolve the specific requirement the report identifies.", "SETUP.md · Core / Windows"], ["Windows: cannot write · OneDrive · permissions", "Use a complete copy in a local folder you control, outside OneDrive and protected folders. Do not disable system protection to finish this tutorial.", "SETUP.md · Windows"], ["Transcript came out in another language · translation", "The kit detects each clip’s language automatically. If the text is in a language you did not speak, or has many doubtful words, ask to re-run transcription forcing the language: transcribe.sh projects/<job> --force --lang en. Never approve cuts on a wrong transcript.", "Step 5 · SETUP.md · Language"], ["First transcription is slow · WhisperX", "The initial model is roughly 3–5 GB; its environment and GPU components can add more. Ask for download progress, free disk space and the latest message. Timing depends on hardware and connection.", "SETUP.md · First edit"], ["Premiere does not connect · MCP", "Check whether the Premiere installer completed. Restart Premiere and Claude Code as directed in SETUP.md and review the project connection. Ask for bridge diagnostics before reinstalling.", "SETUP.md · Premiere lane"], ["Resolve · BRIDGE_UNAVAILABLE", "Specify Free or Studio. The documented Free route requires opening a project and running Workspace → Scripts → resolve_bridge each time you start Resolve. Follow your edition’s instructions.", "SETUP.md · DaVinci Resolve lane"], ["Caption covers a face or has a typo", "Give the exact time and correct wording. Ask to correct the source transcript where applicable and check the framing in a preview.", "Step 6 · CLAUDE.md / graphics"], ["Cannot find the MP4 · export", "In Claude Code check .claude/agents/video-editor-help.md. In Codex request help mode in AGENTS.md; Claude agents are not automatically registered.", "Step 7 · finalize.sh"], ["Help agent is missing", "The guide opens in a browser. Editing requires local Claude Code or Codex with tools. AI usage and paid applications are separate.", "Step 9 · help/QUICK-START.md"], ["Can I use a phone? Are credits included?", "You can read this guide on a phone. Editing runs on a computer with Claude Code and its tools. Your Claude usage, paid apps and optional services are separate.", "Step 1 · SETUP.md"]]}};const IMAGES={"workspace": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwQDAwQEBAQFBQQFBwsHBwYGBw4KCggLEA4RERAOEA8SFBoWEhMYEw8QFh8XGBsbHR0dERYgIh8cIhocHRz/2wBDAQUFBQcGBw0HBw0cEhASHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBz/wgARCAQABgADASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAgABAwQFBgcI/8QAGQEBAQEBAQEAAAAAAAAAAA 'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={lang:'es',host:'codex',os:'mac',lane:'chat-only',step:0,done:[],review:[]},saved=true;
try{const x=JSON.parse(localStorage.getItem('video-editor-guide-v2')||'null');if(x&&typeof x==='object')state={...state,...x};}catch(e){saved=false;}
if(!['es','en'].includes(state.lang))state.lang='es';if(!['mac','windows','linux'].includes(state.os))state.os='mac';if(!['chat-only','Premiere','Resolve','CapCut'].includes(state.lane))state.lane='chat-only';if(!Number.isInteger(state.step)||state.step<0||state.step>9)state.step=0;state.done=Array.isArray(state.done)?[...new Set(state.done.filter(x=>Number.isInteger(x)&&x>=0&&x<10))]:[];state.review=Array.isArray(state.review)?state.review.filter(x=>Number.isInteger(x)&&x>=0&&x<4):[];
if(!['codex','claude'].includes(state.host))state.host='codex';
let draft={path:'',goal:'',format:'vertical',look:'basic'},demoGood=true;
const t=(es,en)=>state.lang==='es'?es:en;
function persist(){try{localStorage.setItem('video-editor-guide-v2',JSON.stringify(state));saved=true;}catch(e){saved=false;}updateProgress();}
function notify(msg){$('#toast').textContent=msg;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').textContent='',4500);}
function promptBox(id,txt){return `<div class="prompt"><div class="prompt-head"><span>${t('Pega esto en Claude Code o Codex','Paste this into Claude Code or Codex')}</span><button type="button" data-copy="${id}">${t('Copiar','Copy')}</button></div><pre id="${id}">${esc(txt)}</pre><p>${t('Sustituye lo que esté entre [corchetes] por tus datos.','Replace anything in [brackets] with your own details.')}</p></div>`;}
function stepLink(i,label){return `<button data-go="${i}">${label}</button>`;}
function laneInfo(){const info={
'chat-only':t('Procesa y exporta localmente sin una app de edición. Requiere Claude Code o Codex y las herramientas del kit. El color de larga duración y la mezcla automática de efectos de sonido no están implementados en esta ruta; confirma cualquier paso manual. Verificada de punta a punta solo en macOS; en Windows y Linux los scripts la soportan, pero aún no se ha verificado de punta a punta: prueba primero con un clip corto.','Processes and exports locally without an editing app. It still needs Claude Code or Codex and the kit tools. Long-form grading and automated sound-effect mixing are not implemented on this route; confirm any manual steps. Verified end to end on macOS only; on Windows and Linux it is supported by the scripts but not yet verified end to end: try a short clip first.'),
Premiere:t('Ruta documentada para macOS y Windows, con Premiere Pro y su puente local. No está disponible en Linux. La documentación de instalación valida Premiere 2026 (26.x); comprueba tu versión y la conexión antes del primer trabajo.','Documented for macOS and Windows with Premiere Pro and its local bridge. Not available on Linux. Setup documentation validates Premiere 2026 (26.x); check your version and connection before the first job.'),
Resolve:t('La instalación distingue Free y Studio. Free necesita iniciar resolve_bridge desde el menú Scripts al abrir Resolve. Algunas tareas de color y efectos de sonido necesitan intervención manual o no tienen una automatización validada.','Setup distinguishes Free and Studio. Free needs resolve_bridge started from the Scripts menu when Resolve opens. Some grading and sound-effect tasks need manual work or lack validated automation.'),
CapCut:t('La automatización del kit está documentada solo para macOS. Debes cerrar CapCut completamente antes de crear el borrador. Color y efectos de sonido tienen pasos manuales; no presupongas compatibilidad con Windows.','Kit automation is documented for macOS only. Fully quit CapCut before creating its draft. Grading and sound effects involve manual steps; do not assume Windows support.')};return info[state.lane];}
function routePrompt(){return t(`Mi entorno es ${state.host}. Mi sistema es ${state.os} y quiero usar ${state.lane}. Lee SETUP.md y LANES.md. Confirma si esta combinación está documentada, comprueba la conexión y dime qué pasos requieren intervención manual o no están validados. No cambies de ruta ni instales servicios de pago sin explicármelo.`,`My host is ${state.host}. My system is ${state.os} and I want to use ${state.lane}. Read SETUP.md and LANES.md. Confirm whether this combination is documented, check the connection and explain which steps need manual work or lack validation. Do not change routes or install paid services without explaining it.`);}
function editPrompt(){return t(`Edita mi clip en ${draft.path||'[ruta completa del video]'} para ${draft.goal||'[objetivo del video]'}. Usa ${state.lane} en ${state.os}; confirma antes que esa combinación esté configurada. Formato: ${draft.format==='vertical'?'vertical 9:16':'horizontal 16:9'}. Estilo: ${draft.look==='basic'?'básico, gráficos discretos':'el de mi brand-kit.md, si está configurado'}. Es una prueba corta: copia el material a un proyecto nuevo y conserva el original. Mantén el significado; propón cortes de pausas innecesarias. Revisa conmigo la transcripción y los cortes. ${draft.format==='vertical'?'Incluye subtítulos legibles sin cubrir el rostro.':'Confirma las opciones de texto del preset horizontal; no presupongas subtítulos automáticos.'} El audio está en español: si la transcripción sale en otro idioma, repítela con --lang es antes de proponer cortes. No uses música ni generación de pago. Si una función no está disponible, explícalo. Muéstrame el borrador y espera mi revisión antes de exportar la versión final.`,`Edit my clip at ${draft.path||'[full video file path]'} for ${draft.goal||'[video goal]'}. Use ${state.lane} on ${state.os}; first confirm this combination is configured. Format: ${draft.format==='vertical'?'vertical 9:16':'horizontal 16:9'}. Style: ${draft.look==='basic'?'basic with restrained graphics':'my brand-kit.md style, if configured'}. This is a short test: copy the footage into a new project and preserve the original. Keep its meaning and propose cuts to unnecessary pauses. Review the transcript and cuts with me. ${draft.format==='vertical'?'Include readable captions without covering the face.':'Confirm text options for the horizontal preset; do not assume automatic captions.'} The audio is in English: if the transcript comes out in another language, re-run it with --lang en before proposing cuts. Do not use music or paid generation. Explain any unavailable feature. Show the draft and wait for my review before exporting the final version.`);}
function special(i){switch(i){
case 0:return `<div class="kit-grid"><div class="kit-card"><span class="kit-icon">↗</span><b>${t('El editor','The editor')}</b><p>${t('Ejecuta el flujo de trabajo con tu material.','Runs the workflow with your footage.')}</p></div><div class="kit-card"><span class="kit-icon">▤</span><b>${t('La guía','The guide')}</b><p>${t('Te muestra qué hacer y qué comprobar.','Shows what to do and what to check.')}</p></div><div class="kit-card"><span class="kit-icon">?</span><b>${t('La ayuda','The help agent')}</b><p>${t('Lee la documentación y explica dudas.','Reads the docs and explains questions.')}</p></div></div><div class="timeline" aria-label="${t('Recorrido del primer video','First video workflow')}">${[t('Preparar','Prepare'),t('Configurar','Set up'),t('Editar','Edit'),t('Revisar','Review'),t('Exportar','Export')].map(x=>`<span>${x}</span>`).join('')}</div><p class="note">${t('Puedes leer esta guía sin conexión. La edición y las descargas necesitan sus herramientas y servicios. El tiempo del primer trabajo depende de tu equipo; completar una lista no demuestra que el editor haya funcionado.','You can read this guide offline. Editing and downloads require their tools and services. First-run time depends on your computer; ticking a checklist does not prove the editor worked.')}</p>`;
case 1:return `<div class="map"><header>${t('Elige tu entorno','Choose your environment')}</header><div class="file-row"><code>Claude Code</code><span>${t('Abre el proyecto completo. Lee CLAUDE.md. En terminal, usa claude desde la carpeta del kit.','Open the complete project and read CLAUDE.md. In a terminal, run claude from the kit folder.')}</span></div><div class="file-row"><code>Codex</code><span>${t('Abre la carpeta como proyecto local. Lee AGENTS.md y help/USAR-CON-CODEX.md. En la CLI, usa codex desde esa carpeta.','Open the folder as a local project. Read AGENTS.md and help/USAR-CON-CODEX.md. In the CLI, run codex from that folder.')}</span></div></div><p class="note">${t('Conserva .claude: contiene las etapas compartidas del editor. En Codex, sus hooks y conexiones no se activan automáticamente. Esta adaptación todavía requiere una prueba de edición completa en una instalación limpia.','Keep .claude: it contains the shared editing stages. Its hooks and connections do not automatically activate in Codex. This adaptation still needs a clean-install end-to-end editing test.')}</p><div class="links"><a href="https://code.claude.com/docs/en/quickstart" target="_blank" rel="noopener">Claude Code ↗</a><a href="https://developers.openai.com/codex/quickstart" target="_blank" rel="noopener">Codex ↗</a><a href="help/USAR-CON-CODEX.md">${t('Guía de Codex','Codex guide')} ↗</a></div>`;
case 2:return `<div class="timeline">${[t('Revisar equipo','Check system'),t('Instalar','Install'),t('Reiniciar si se pide','Restart if asked'),t('Verificar','Verify')].map(x=>`<span>${x}</span>`).join('')}</div><p class="note">${t('FFmpeg procesa video y audio; WhisperX transcribe; HyperFrames crea gráficos. No necesitas memorizar sus comandos: pide al editor que siga SETUP.md. Un informe correcto de requisitos aún debe confirmarse con un video de prueba.','FFmpeg processes picture and sound; WhisperX transcribes; HyperFrames builds graphics. You do not need to memorize their commands: ask the editor to follow SETUP.md. A passing prerequisite report still needs a practical test edit.')}</p>`;
case 3:return `<div class="lane-grid">${['chat-only','Premiere','Resolve','CapCut'].map(x=>`<button data-lane="${x}" aria-pressed="${state.lane===x}"><strong>${x==='chat-only'?t('Sin app de edición','No editing app'):x}</strong><small>${x==='chat-only'?t('chat-only · verificado en macOS · Windows/Linux: soportado por los scripts, aún sin verificar de punta a punta','chat-only · verified on macOS · Windows/Linux: supported by the scripts, not yet verified end to end'):x==='Premiere'?'Mac / Windows':x==='Resolve'?'Mac / Windows / Linux':t('Solo macOS','macOS only')}</small></button>`).join('')}</div><div class="lane-detail"><b>${t('Lo que debes saber','What to know')}</b>${laneInfo()}</div>${promptBox('route-prompt',routePrompt())}<p class="note">${t('Estas diferencias proceden de SETUP.md y LANES.md de la versión 2026.09.08. Verifica la documentación instalada si el paquete cambia.','These differences come from SETUP.md and LANES.md in version 2026.09.08. Check your installed documentation if the package changes.')}</p>`;
case 4:return `<div class="form-grid"><label class="wide">${t('1. Ruta completa del clip','1. Full clip path')}<input id="clip-path" type="text" autocomplete="off" spellcheck="false" value="${esc(draft.path)}" placeholder="${state.os==='windows'?'C:\\Users\\YourName\\Videos\\test.mp4':state.os==='linux'?'/home/yourname/Videos/test.mp4':'/Users/YourName/Downloads/test.mp4'}"><small>${t('Solo se usa para armar tu instrucción. No se sube el archivo ni se guarda esta ruta al cerrar.','Used only to create your instruction. The file is not uploaded and this path is not saved after closing.')}</small></label><label class="wide">${t('2. ¿Qué quieres comunicar?','2. What do you want to communicate?')}<input id="clip-goal" type="text" value="${esc(draft.goal)}" placeholder="${t('Ej.: explicar mi servicio a nuevos clientes','E.g. explain my service to new clients')}" maxlength="500"></label><label>${t('3. Formato','3. Format')}<select id="clip-format"><option value="vertical" ${draft.format==='vertical'?'selected':''}>${t('Vertical · Reels / Shorts','Vertical · Reels / Shorts')}</option><option value="horizontal" ${draft.format==='horizontal'?'selected':''}>${t('Horizontal · YouTube','Horizontal · YouTube')}</option></select></label><label>${t('4. Estilo','4. Style')}<select id="clip-look"><option value="basic" ${draft.look==='basic'?'selected':''}>${t('Básico para probar','Basic test style')}</option><option value="brand" ${draft.look==='brand'?'selected':''}>${t('Mi marca configurada','My configured brand')}</option></select></label></div>${promptBox('edit-prompt',editPrompt())}<div class="timeline">${[t('Material','Intake'),t('Cortes','Rough cut'),t('Audio','Audio'),t('Texto / gráficos','Text / graphics'),t('Tu revisión','Your review'),t('MP4','MP4')].map(x=>`<span>${x}</span>`).join('')}</div>`;
case 5:return `<div class="review-demo"><div class="phone ${demoGood?'':'bad'}" id="phone"><img src="${IMAGES.portrait}" alt="${t('Persona ficticia frente a cámara para practicar la ubicación del subtítulo','Fictional speaker used to demonstrate caption placement')}"><span class="safe-label">${t('EJEMPLO VISUAL','VISUAL EXAMPLE')}</span><span class="caption">${t('Tu mensaje,<br>fácil de entender.','Your message,<br>easy to understand.')}</span></div><div class="demo-controls"><div class="eyebrow">${t('Aprende a revisar','Learn what to look for')}</div><h3>${t('Deja respirar al rostro.','Give the face some room.')}</h3><p id="demo-explain">${demoText()}</p><button data-demo="bad" aria-pressed="${!demoGood}">${t('Ver problema','See problem')}</button><button data-demo="good" aria-pressed="${demoGood}">${t('Ver ajuste','See adjustment')}</button><small>${t('Fotografía generada con IA y composición didáctica. No es una captura ni un resultado de una edición real. Comprueba también las zonas ocupadas por la interfaz de cada red.','AI-generated photo and teaching composition. This is not a screenshot or an actual editing result. Also check the areas covered by each social app’s interface.')}</small></div></div><h3>${t('Mi revisión del borrador','My draft review')}</h3><div class="review-checks">${[t('El mensaje conserva su sentido','The message keeps its meaning'),t('Nombres, cifras y subtítulos están bien','Names, numbers and captions are correct'),t('El rostro se ve y el texto se lee','The face is visible and text is readable'),t('La voz se escucha con claridad','The voice sounds clear')].map((x,j)=>`<label><input type="checkbox" data-review="${j}" ${state.review.includes(j)?'checked':''}>${x}</label>`).join('')}</div>`;
case 6:return `<div class="map"><header>${t('Dónde buscar · ejemplo de un proyecto llamado “test”','Where to look · example project named “test”')}</header><div class="root">▱ video-editor/</div><div class="file-row indent"><code>projects/test/</code><span>${t('Tu trabajo','Your job')}</span></div><div class="file-row indent"><code>RUN.md</code><span>${t('Registro del avance','Progress record')}</span></div><div class="file-row indent"><code>outputs/test.final.mp4</code><span>${t('El archivo para reproducir y compartir','The file to play and share')}</span></div></div><p class="note">${t('“test” es solo un ejemplo. Usa la ruta exacta que reporte el editor para tu trabajo.','“test” is only an example. Use the exact path reported for your own job.')}</p>`;
case 7:return `<div class="map"><header>brand-kit.md · ${t('Ejemplo ficticio','Fictional example')}</header>${[[t('Marca','Brand'),'Studio North'],[t('Tono','Tone'),t('Claro, cercano, sin exageraciones','Clear, friendly, no exaggeration')],[t('Color','Color'),'#6750BD'],[t('Palabras clave','Word list'),'Studio North, Mara']].map(a=>`<div class="file-row"><code>${a[0]}</code><span>${a[1]}</span></div>`).join('')}</div>`;
case 8:return `<label class="help-search">${t('Busca por error o palabra','Search by error or keyword')}<input id="faq-search" type="search" placeholder="${t('Ej.: Windows, subtítulo, MP4…','E.g. Windows, caption, MP4…')}"></label><div class="faq" id="faq">${faqMarkup('')}</div><p class="note">${t('Este buscador consulta respuestas incluidas en la guía. Para una pregunta nueva, copia la instrucción y usa el agente dentro de Claude Code o el modo de ayuda de Codex.','This search finds answers included in the guide. For a new question, copy the instruction and use the help agent in Claude Code or documented help mode in Codex.')}</p>`;
case 9:return `<div class="map"><header>${t('Antes de cerrar un trabajo','Before closing a job')}</header><div class="file-row"><code>1</code><span>${t('Originales respaldados','Original footage backed up')}</span></div><div class="file-row"><code>2</code><span>${t('Proyecto y RUN.md conservados','Project and RUN.md preserved')}</span></div><div class="file-row"><code>3</code><span>${t('MP4 final revisado','Final MP4 reviewed')}</span></div></div>`;
}}
function demoText(){return demoGood?t('El subtítulo deja libre la cara y tiene contraste. Es un punto de partida: revisa cada encuadre del video.','The caption leaves the face clear and has contrast. This is a starting point: check every framing change in your video.'):t('Aquí el texto invade la cara. Pide el cambio con un tiempo concreto y comprueba el nuevo encuadre.','Here the text overlaps the face. Request the change at a specific time and check the new framing.');}
function faqMarkup(q){const n=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const hits=DATA[state.lang].faq.filter(a=>n(a.join(' ')).includes(n(q))).sort((a,b)=>Number(n(b[0]).includes(n(q)))-Number(n(a[0]).includes(n(q))));return hits.length?hits.map(a=>`<details ${q?'open':''}><summary>${esc(a[0])}</summary><p>${esc(a[1])}</p><small>${esc(a[2])}</small></details>`).join(''):`<p class="faq-empty">${t('No hay una respuesta exacta. Usa la instrucción del agente de ayuda con el mensaje de error completo y sin datos privados.','No exact answer found. Use the help-agent instruction with the full, redacted error message.')}</p>`;}
function render(){const rows=DATA[state.lang].steps;document.documentElement.lang=state.lang;document.title=t('Video Editor · Tu primer video','Video Editor · Your first video');$('#app').innerHTML=`<a class="skip" href="#lesson-${state.step+1}">${t('Ir al contenido','Skip to content')}</a><header class="topbar"><div class="brand"><span class="mark" aria-hidden="true">↗</span>Video Editor<span class="edition">FIELD GUIDE / 03</span></div><div class="topright"><select id="language" aria-label="${t('Idioma','Language')}"><option value="es" ${state.lang==='es'?'selected':''}>Español</option><option value="en" ${state.lang==='en'?'selected':''}>English</option></select><button id="print">${t('Guardar PDF','Save PDF')}</button></div></header><div class="shell"><aside class="sidebar"><div class="eyebrow">${t('Tu primer video','Your first video')}</div><div class="progress-head"><span>${t('Tu progreso','Your progress')}</span><span data-progress></span></div><progress max="10" value="${state.done.length}" aria-label="${t('Pasos completados','Steps completed')}"></progress><nav aria-label="${t('Pasos de la guía','Guide steps')}">${rows.map((a,i)=>`${[0,4,7].includes(i)?`<div class="group">${i===0?t('01 / Preparar','01 / Set up'):i===4?t('02 / Crear','02 / Create'):t('03 / Continuar','03 / Keep going')}</div>`:''}<button data-go="${i}" ${state.step===i?'aria-current="step"':''}><span class="num ${state.done.includes(i)?'done':''}">${state.done.includes(i)?'✓':String(i+1).padStart(2,'0')}</span>${a[0]}</button>`).join('')}</nav><div class="side-help"><b style="font-size:13px">${t('¿Te quedaste en un paso?','Stuck on a step?')}</b><p>${t('Busca el error o prepara tu pregunta para el agente de ayuda.','Find the error or prepare your question for the help agent.')}</p>${stepLink(8,t('Abrir ayuda ↗','Open help ↗'))}</div></aside><main class="main"><div class="mobile-nav"><select id="mobile-step" aria-label="${t('Elegir paso','Choose step')}">${rows.map((a,i)=>`<option value="${i}" ${i===state.step?'selected':''}>${String(i+1).padStart(2,'0')} · ${a[0]}</option>`).join('')}</select><span data-progress></span></div><section class="hero"><div class="hero-copy"><span class="tag">${t('GUÍA INTERACTIVA · DESDE CERO','INTERACTIVE GUIDE · FROM ZERO')}</span><h1>${t('De tu primer clip<br>a tu primer video.','From your first clip<br>to your first video.')}</h1><p>${t('Un paso a la vez. Instrucciones claras, ejemplos visuales y ayuda cuando la necesites.','One step at a time. Clear instructions, visual examples and help when you need it.')}</p><button class="primary" id="resume">${t('Continuar mi recorrido','Continue my journey')} ↗</button></div><figure><img src="${IMAGES.workspace}" alt="${t('Escritorio de edición con portátil, cámara y audífonos','Editing desk with laptop, camera and headphones')}"><figcaption>${t('Imagen ilustrativa creada con IA','Illustrative AI-generated image')}</figcaption></figure></section><div class="context"><label>${t('Mi asistente','My assistant')}<select id="host"><option value="codex" ${state.host==='codex'?'selected':''}>Codex</option><option value="claude" ${state.host==='claude'?'selected':''}>Claude Code</option></select></label><label>${t('Mi equipo','My system')}<select id="os"><option value="mac" ${state.os==='mac'?'selected':''}>macOS</option><option value="windows" ${state.os==='windows'?'selected':''}>Windows</option><option value="linux" ${state.os==='linux'?'selected':''}>Linux</option></select></label><label>${t('Mi ruta','My route')}<select id="lane">${['chat-only','Premiere','Resolve','CapCut'].map(x=>`<option ${state.lane===x?'selected':''}>${x}</option>`).join('')}</select></label><span class="saved" id="save-status"></span></div><div id="lessons">${rows.map((a,i)=>`<article class="lesson" id="lesson-${i+1}" tabindex="-1" ${i!==state.step?'hidden':''}><header class="lesson-head"><span class="big-number">${String(i+1).padStart(2,'0')}</span><div><h2>${a[0]}</h2><p class="subtitle">${a[1]}</p></div></header><h3>${t('Haz esto','Do this')}</h3><ol class="action-list">${a[2].map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${special(i)}${a[5]?promptBox('prompt-'+i,a[5]):''}<div class="checks"><div class="signal"><strong>✓ ${t('Sabes que funcionó cuando…','You know it worked when…')}</strong><p>${esc(a[3])}</p></div><div class="stuck"><strong>↳ ${t('Si te atoras','If you get stuck')}</strong><p>${esc(a[4])}</p></div></div><label class="complete"><input type="checkbox" data-complete="${i}" ${state.done.includes(i)?'checked':''}>${t('Ya hice y comprobé este paso','I completed and checked this step')}</label></article>`).join('')}</div><div class="step-footer"><button data-go="${Math.max(0,state.step-1)}" ${state.step===0?'disabled':''}>← ${t('Anterior','Previous')}</button><span>${t('Paso','Step')} ${state.step+1} / 10</span><button class="primary" data-go="${Math.min(9,state.step+1)}" ${state.step===9?'disabled':''}>${t('Siguiente','Next')} →</button></div><footer class="foot"><p>${t('Guía 03 · Septiembre de 2026. Basada en el kit 2026.09.08. Las ilustraciones no representan pruebas de funcionamiento. Consulta SETUP.md y LANES.md para los detalles de tu versión. La guía no incluye consumo de IA ni sustituye la revisión del video.','Guide 03 · September 2026. Based on kit 2026.09.08. Illustrations are not evidence of working features. See SETUP.md and LANES.md for your version’s details. Claude usage is separate and videos still need your review.')} <a href="https://code.claude.com/docs/en/quickstart" target="_blank" rel="noopener">Claude Code docs ↗</a></p><button class="quiet" id="reset">${t('Reiniciar progreso','Reset progress')}</button></footer></main></div>`;bind();updateProgress();}
function updateProgress(){$$('[data-progress]').forEach(x=>x.textContent=`${new Set(state.done).size} / 10`);$$('progress').forEach(x=>x.value=new Set(state.done).size);const s=$('#save-status');if(s)s.textContent=saved?t('Progreso guardado en este navegador','Progress saved in this browser'):t('Progreso solo durante esta sesión','Progress lasts for this session only');}
function go(i){state.step=i;persist();history.replaceState(null,'',`#step-${i+1}`);render();const target=$('#lesson-'+(i+1));target.scrollIntoView({behavior:'auto',block:'start'});target.focus({preventScroll:true});}
async function copy(id){const value=document.getElementById(id).textContent;try{if(!navigator.clipboard)throw new Error('clipboard unavailable');await navigator.clipboard.writeText(value);notify(t('Instrucción copiada. Pégala en Claude Code o Codex.','Instruction copied. Paste it into Claude Code.'));}catch(e){$('#copy-text').value=value;$('#copy-title').textContent=t('Copia la instrucción','Copy the instruction');$('#copy-hint').textContent=t('Selecciona el texto y usa ⌘C o Ctrl+C. Después pégalo en Claude Code o Codex.','Select the text and use ⌘C or Ctrl+C. Then paste it into Claude Code.');$('#close-copy').textContent=t('Cerrar','Close');$('#copy-dialog').showModal();$('#copy-text').focus();$('#copy-text').select();}}
function bind(){$$('[data-go]').forEach(x=>x.onclick=()=>go(Number(x.dataset.go)));$$('[data-copy]').forEach(x=>x.onclick=()=>copy(x.dataset.copy));$('#language').onchange=e=>{state.lang=e.target.value;persist();render();};$('#host').onchange=e=>{state.host=e.target.value;persist();render();};$('#os').onchange=e=>{state.os=e.target.value;persist();render();};$('#lane').onchange=e=>{state.lane=e.target.value;persist();render();};$('#mobile-step').onchange=e=>go(Number(e.target.value));$('#resume').onclick=()=>go(state.done.length===10?9:rowsNext());$('#print').onclick=()=>{notify(t('En la ventana de impresión, elige Guardar como PDF. Se incluyen los diez pasos.','Choose Save as PDF in the print dialog. All ten steps are included.'));window.print();};$('#reset').onclick=()=>{if(confirm(t('¿Borrar las marcas de progreso de esta guía en este navegador?','Clear this guide’s progress checkmarks in this browser?'))){state.done=[];state.review=[];state.step=0;persist();render();}};$$('[data-complete]').forEach(x=>x.onchange=()=>{const i=Number(x.dataset.complete);state.done=x.checked?[...new Set([...state.done,i])]:state.done.filter(n=>n!==i);persist();const nav=$(`nav [data-go="${i}"] .num`);if(nav){nav.classList.toggle('done',x.checked);nav.textContent=x.checked?'✓':String(i+1).padStart(2,'0');}notify(t('Progreso actualizado.','Progress updated.'));});$$('[data-review]').forEach(x=>x.onchange=()=>{const i=Number(x.dataset.review);state.review=x.checked?[...new Set([...state.review,i])]:state.review.filter(n=>n!==i);persist();});$$('[data-lane]').forEach(x=>x.onclick=()=>{state.lane=x.dataset.lane;persist();render();});$$('[data-demo]').forEach(x=>x.onclick=()=>{demoGood=x.dataset.demo==='good';$('#phone').classList.toggle('bad',!demoGood);$('#demo-explain').textContent=demoText();$$('[data-demo]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.demo==='good')===demoGood)));});for(const [id,key] of [['clip-path','path'],['clip-goal','goal'],['clip-format','format'],['clip-look','look']])$('#'+id).addEventListener('input',e=>{draft[key]=e.target.value;$('#edit-prompt').textContent=editPrompt();});$('#faq-search').oninput=e=>$('#faq').innerHTML=faqMarkup(e.target.value);}
function rowsNext(){return DATA[state.lang].steps.findIndex((_,i)=>!state.done.includes(i));}
const match=location.hash.match(/^#step-(\d+)$/);if(match&&Number(match[1])>=1&&Number(match[1])<=10)state.step=Number(match[1])-1;
$('#close-copy').onclick=()=>$('#copy-dialog').close();render();
</script></body></html>
